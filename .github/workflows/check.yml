name: Check
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      # The token is needed only while ZeframLou/zklean is private.
      - name: Install dependencies
        env:
          ZKLEAN_READ_TOKEN: ${{ secrets.ZKLEAN_READ_TOKEN }}
        run: |
          if [ -n "$ZKLEAN_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:$ZKLEAN_READ_TOKEN@github.com/".insteadOf https://git@github.com/
          fi
          bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      # No native tools or Lean are installed in this job.
      - run: bun run example

  formal-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - id: sdk
        name: Read the development SDK pin
        run: |
          bun -e 'import p from "./package.json"; const ref=p.devDependencies.zklean.split("#")[1]; if(!/^(v\d+\.\d+\.\d+|[0-9a-f]{40})$/.test(ref)) throw new Error("pin the SDK to a release tag or commit"); console.log("ref="+ref)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ZeframLou/zklean
          ref: ${{ steps.sdk.outputs.ref }}
          path: .tooling/zklean
          token: ${{ secrets.ZKLEAN_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .tooling/zklean -> target
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build ZKLean's native checker and exporter
        working-directory: .tooling/zklean
        run: |
          bun install --frozen-lockfile
          cargo build --release --locked -p zklean-native
          bash scripts/setup-exporter.sh
      - name: Check the example certificates against their Lean sources
        env:
          ZKLEAN_READ_TOKEN: ${{ secrets.ZKLEAN_READ_TOKEN }}
        run: |
          if [ -n "$ZKLEAN_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:$ZKLEAN_READ_TOKEN@github.com/".insteadOf https://git@github.com/
          fi
          bun install --frozen-lockfile
          # ZKLean finds its native checker, exporter and Lake from its checkout.
          export ZKLEAN_CLI="$PWD/.tooling/zklean/src/cli.ts"
          bun run check:certificates
